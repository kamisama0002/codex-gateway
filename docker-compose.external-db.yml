services:
  mysql:
    profiles: ["disabled-in-external-db-mode"]

  database-migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for external database mode}
      MYSQL_TLS_CA_FILE: ${MYSQL_TLS_CA_FILE:-}
      MYSQL_TLS_MODE: ${MYSQL_TLS_MODE:?MYSQL_TLS_MODE is required for external database mode}
    depends_on: !reset {}
    networks: !override
      - web-common

  codex-gateway:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for external database mode}
      MYSQL_TLS_CA_FILE: ${MYSQL_TLS_CA_FILE:-}
      MYSQL_TLS_MODE: ${MYSQL_TLS_MODE:?MYSQL_TLS_MODE is required for external database mode}
    networks: !override
      - web-common
      - runtime-manager
      - agent-runtime
