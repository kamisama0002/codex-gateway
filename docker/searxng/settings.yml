use_default_settings:
  engines:
    keep_only:
      - bing
      - baidu

general:
  instance_name: Qiancheng Agent Search

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

engines:
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
  - name: baidu
    disabled: false
