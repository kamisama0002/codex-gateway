services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codex_gateway_test_bootstrap
      MYSQL_PASSWORD: codex-gateway-mysql-test-password
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: codex-gateway-mysql-test-root-password
      MYSQL_USER: codex_gateway_test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

  test-runner:
    image: node:24-bookworm
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_TEST_ADMIN_DATABASE_URL: mysql://root:codex-gateway-mysql-test-root-password@mysql:3306/mysql
      MYSQL_TEST_DATABASE_URL: mysql://codex_gateway_test:codex-gateway-mysql-test-password@mysql:3306/codex_gateway_test_bootstrap
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - test-node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store

volumes:
  mysql-data:
  pnpm-store:
  test-node-modules:
