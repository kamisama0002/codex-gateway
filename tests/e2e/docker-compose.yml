x-ssh-target: &ssh-target
  environment:
    CODEX_HOME: /home/codex/.codex
  volumes:
    - ../..:/workspace/codex-gateway
    # Optional host-side provider credential used by containerized remote Codex tests. The
    # run script falls back to /dev/null so ordinary contributors do not need this file.
    - ${E2E_CODEX_PROVIDER_KEY_FILE:-/dev/null}:/run/secrets/codex-provider-key:ro

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${E2E_MYSQL_DATABASE:?E2E_MYSQL_DATABASE is required}
      MYSQL_PASSWORD: codex-gateway-e2e-password
      MYSQL_ROOT_PASSWORD: codex-gateway-e2e-root-password
      MYSQL_USER: codex_gateway_e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

  agent-runtime-image:
    profiles: ["image-build"]
    image: ${E2E_AGENT_IMAGE:-codex-agent-runtime:0.153.4}
    build:
      context: ../..
      dockerfile: docker/agent-runtime.Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}

  agent-runtime-manager:
    image: ${E2E_RUNTIME_MANAGER_IMAGE:-codex-runtime-manager-e2e:0.153.4}
    build:
      context: ../..
      dockerfile: docker/runtime-manager.Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    environment:
      NODE_ENV: test
      RUNTIME_MANAGER_E2E_INSPECTION: "1"
      RUNTIME_MANAGER_AGENT_NETWORK: ${E2E_AGENT_NETWORK_NAME:-codex-gateway-e2e-agent-runtime}
      RUNTIME_MANAGER_AGENT_EGRESS_NETWORK: ${E2E_AGENT_EGRESS_NETWORK_NAME:-codex-gateway-e2e-agent-egress}
      RUNTIME_MANAGER_IMAGE_ALIASES: '{"stable":{"image":"${E2E_AGENT_IMAGE:-codex-agent-runtime:0.153.4}","imageVersion":"0.153.4"}}'
      RUNTIME_MANAGER_PORT: "8787"
      RUNTIME_MANAGER_RESOURCE_LABELS: '{"com.codex-gateway.e2e-managed":"${E2E_MANAGED_LABEL_VALUE:-codex-gateway-e2e}"}'
      RUNTIME_MANAGER_SHARED_SECRET: ${RUNTIME_MANAGER_SHARED_SECRET:-codex-gateway-e2e-runtime-manager-secret}
    expose:
      - "8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runtime-manager-data:/data
    networks:
      - runtime-manager
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(8787,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  bark-target:
    image: node:22-bookworm
    command: ["node", "/app/bark-server.ts"]
    environment:
      BARK_TEST_PORT: "8080"
      BARK_TEST_LOG: /requests/requests.jsonl
    volumes:
      - ./bark-server.ts:/app/bark-server.ts:ro
      - bark-requests:/requests

  model-target:
    image: node:22-bookworm
    command: ["node", "/app/model-target-server.mjs"]
    environment:
      MODEL_TARGET_PORT: "8080"
      MODEL_TARGET_MODEL: ${E2E_CODEX_MODEL:-gpt-5.6-luna}
    volumes:
      - ./model-target-server.mjs:/app/model-target-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/v1/models').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  dataops-target:
    image: node:22-bookworm
    command: ["node", "/app/dataops-target-server.mjs"]
    environment:
      DATAOPS_TARGET_PORT: "8080"
      DATAOPS_TARGET_SHARED_SECRET: dataops-e2e-shared-secret
    volumes:
      - ./dataops-target-server.mjs:/app/dataops-target-server.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  searxng:
    image: searxng/searxng@sha256:55e1fa15a63ff04e79e213e6aa2837549877b0c6d60757cdb633ae9111cb5fea
    environment:
      SEARXNG_SECRET: codex-gateway-e2e-search-secret
    expose:
      - "8080"
    volumes:
      - ../../docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - agent-egress
      - search-backend

  search-mcp:
    image: codex-search-mcp-e2e:0.153.4
    build:
      context: ../..
      dockerfile: docker/search-mcp.Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      SEARXNG_URL: http://searxng:8080
    expose:
      - "8788"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    depends_on:
      searxng:
        condition: service_started
    networks:
      - agent-runtime
      - agent-egress
      - search-backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(8788,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  test-business-mcp:
    image: codex-test-business-mcp-e2e:0.153.4
    build:
      context: ../..
      dockerfile: docker/test-business-mcp.Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BUSINESS_MCP_STATE_DIR: /tmp/test-business-mcp
      HOST: 0.0.0.0
      PORT: "8789"
    expose:
      - "8789"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10003,gid=10003,mode=0700
    networks:
      - agent-runtime
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(8789,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  ssh-target:
    build:
      context: ./docker
      target: empty-runtime
      args:
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  ssh-target-legacy-node:
    build:
      context: ./docker
      target: legacy-node
      args:
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  ssh-target-legacy-codex:
    build:
      context: ./docker
      target: legacy-codex
      args:
        CODEX_CLI_VERSION: ${E2E_CODEX_CLI_VERSION:-0.140.0}
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  build-runner:
    image: ${E2E_RUNNER_IMAGE:-codex-gateway-e2e-runner}
    mem_limit: 2g
    build:
      context: ../..
      dockerfile: tests/e2e/runner.Dockerfile
    environment:
      # Keep enough cgroup headroom for Rolldown/Nitro native allocations while allowing the
      # JavaScript heap to finish the production bundle. The container remains capped at 2 GiB.
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: mysql://codex_gateway_e2e:codex-gateway-e2e-password@mysql:3306/${E2E_MYSQL_DATABASE:?E2E_MYSQL_DATABASE is required}
      E2E_GATEWAY_USERNAME: ${E2E_GATEWAY_USERNAME:-e2e}
      E2E_GATEWAY_PASSWORD: ${E2E_GATEWAY_PASSWORD:-codex-gateway-e2e-password}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - build-output:/e2e-output

  gateway-under-test:
    image: ${E2E_RUNNER_IMAGE:-codex-gateway-e2e-runner}
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      agent-runtime-manager:
        condition: service_healthy
      bark-target:
        condition: service_started
      model-target:
        condition: service_healthy
      search-mcp:
        condition: service_healthy
      dataops-target:
        condition: service_healthy
      mysql:
        condition: service_healthy
      ssh-target:
        condition: service_started
      ssh-target-legacy-node:
        condition: service_started
      ssh-target-legacy-codex:
        condition: service_started
      test-business-mcp:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      CODEX_GATEWAY_CONFIG_SECRET: e2e-config-secret
      DATABASE_URL: mysql://codex_gateway_e2e:codex-gateway-e2e-password@mysql:3306/${E2E_MYSQL_DATABASE:?E2E_MYSQL_DATABASE is required}
      DATAOPS_BASE_URL: http://dataops-target:8080
      DATAOPS_SSO_SHARED_SECRET: dataops-e2e-shared-secret
      DATAOPS_ALLOWED_ORIGINS: http://dataops.127.0.0.1.nip.io:3100
      NUXT_IGNORE_LOCK: "1"
      RUNTIME_MANAGER_BASE_URL: http://agent-runtime-manager:8787
      RUNTIME_MANAGER_DEFAULT_IMAGE_ALIAS: stable
      RUNTIME_MANAGER_SHARED_SECRET: ${RUNTIME_MANAGER_SHARED_SECRET:-codex-gateway-e2e-runtime-manager-secret}
      RUNTIME_PROVIDER_PROXY_BASE_URL: http://gateway-under-test:3100/api/internal/providers
      # Preview origins enter through the nginx sidecar below. This mirrors production so remote
      # /_nuxt/* assets cannot be intercepted as Gateway public assets before reaching the proxy.
      BROWSER_PREVIEW_PUBLIC_PORT: "3200"
      BROWSER_PREVIEW_DOMAIN: 127.0.0.1.nip.io
      BROWSER_PREVIEW_SCHEME: http
    volumes:
      - build-output:/e2e-output:ro
    # Exercise the same V8 memory policy as production; the wider 2 GiB cgroup remains available
    # to Playwright's shared test topology and native browser/runtime allocations.
    command:
      [
        "/usr/local/bin/codex-gateway-e2e-supervisor",
        "node",
        "--expose-gc",
        "--max-old-space-size=512",
        "/e2e-output/server/index.mjs",
      ]
    networks:
      - default
      - runtime-manager
      - agent-runtime
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3100,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  browser-preview-ingress:
    image: nginx:1.29-alpine
    network_mode: service:gateway-under-test
    depends_on:
      gateway-under-test:
        condition: service_healthy
    volumes:
      - ./docker/browser-preview-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # An unauthenticated preview request correctly returns 401, so readiness probes the listener
      # rather than treating an application status code as an ingress failure.
      test: ["CMD", "nc", "-z", "127.0.0.1", "3200"]
      interval: 1s
      timeout: 3s
      retries: 30

  test-runner:
    image: ${E2E_RUNNER_IMAGE:-codex-gateway-e2e-runner}
    mem_limit: 2g
    network_mode: service:gateway-under-test
    depends_on:
      browser-preview-ingress:
        condition: service_healthy
    environment:
      CI: ${CI:-}
      E2E_GATEWAY_USERNAME: ${E2E_GATEWAY_USERNAME:-e2e}
      E2E_GATEWAY_PASSWORD: ${E2E_GATEWAY_PASSWORD:-codex-gateway-e2e-password}
      E2E_CONTAINERIZED: "1"
      E2E_DATABASE_PREPARED: "1"
      DATABASE_URL: mysql://codex_gateway_e2e:codex-gateway-e2e-password@mysql:3306/${E2E_MYSQL_DATABASE:?E2E_MYSQL_DATABASE is required}
      E2E_SOURCE_DIR: /workspace/source
      E2E_CODEX_HOME: /codex-auth
      E2E_REMOTE_HOST: ssh-target
      E2E_LEGACY_NODE_REMOTE_HOST: ssh-target-legacy-node
      E2E_LEGACY_CODEX_REMOTE_HOST: ssh-target-legacy-codex
      E2E_REMOTE_PORT: "22"
      E2E_REMOTE_USERNAME: codex
      E2E_REMOTE_PASSWORD: codex
      E2E_REMOTE_PROJECT_PATH: /workspace/codex-gateway
      E2E_CODEX_CLI_VERSION: ${E2E_CODEX_CLI_VERSION:-0.140.0}
      E2E_CODEX_MODEL: ${E2E_CODEX_MODEL:-gpt-5.6-luna}
      E2E_MODEL_BASE_URL: ${E2E_MODEL_BASE_URL:-http://model-target:8080/v1}
      E2E_BARK_SERVER_URL: http://bark-target:8080
      E2E_BARK_REQUEST_LOG: /bark-requests/requests.jsonl
      E2E_MANAGED_LABEL_VALUE: ${E2E_MANAGED_LABEL_VALUE:-codex-gateway-e2e}
      E2E_MANAGED_RUNTIME_ENABLED: "1"
      E2E_RUNTIME_SECRET_FIXTURE: ${E2E_RUNTIME_SECRET_FIXTURE:-full-e2e-runtime-secret-fixture}
      E2E_MANAGED_RUNTIME_RESOURCE_EXPECTATIONS_FILE: ${E2E_MANAGED_RUNTIME_RESOURCE_EXPECTATIONS_FILE:?E2E_MANAGED_RUNTIME_RESOURCE_EXPECTATIONS_FILE is required}
      PLAYWRIGHT_BASE_URL: http://codex.127.0.0.1.nip.io:3100
      RUNTIME_MANAGER_BASE_URL: http://agent-runtime-manager:8787
      RUNTIME_MANAGER_SHARED_SECRET: ${RUNTIME_MANAGER_SHARED_SECRET:-codex-gateway-e2e-runtime-manager-secret}
      HOME: /home/pwuser
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ${E2E_CODEX_HOME:-${HOME}/.codex}:/codex-auth:ro
      - ../../test-results:/workspace/codex-gateway/test-results
      - bark-requests:/bark-requests
      - runner-home:/home/pwuser
    working_dir: /workspace/codex-gateway

volumes:
  bark-requests:
  build-output:
  mysql-data:
  runtime-manager-data:
  runner-home:

networks:
  runtime-manager:
    name: ${E2E_RUNTIME_MANAGER_NETWORK_NAME:-codex-gateway-e2e-runtime-manager}
    internal: true
  agent-runtime:
    name: ${E2E_AGENT_NETWORK_NAME:-codex-gateway-e2e-agent-runtime}
    internal: true
  agent-egress:
    name: ${E2E_AGENT_EGRESS_NETWORK_NAME:-codex-gateway-e2e-agent-egress}
  search-backend:
    internal: true
